<style>
*{box-sizing:border-box}
body{margin:0;background:#fdfcfa;color:#2b1f1f;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;font-size:17px;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding:20px 16px 32px}
button{font:inherit;cursor:pointer}
.hero{text-align:center;padding:8px 0 16px}.emoji{font-size:56px;line-height:1.1;text-align:center}
.title{margin:6px 0 4px;font-size:30px;text-align:center}.sub{margin:2px 0;text-align:center;color:#6b5d5d}
.daily{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-radius:18px;background:#fff3c4;color:#3d2f00;text-align:right;box-shadow:inset 0 0 0 1.5px #f0c93a}
.daily.done{background:#eef3ee;color:#2b1f1f;box-shadow:inset 0 0 0 1px #e5e1d8}
.daily .ico{font-size:32px}.daily .main{flex:1;display:flex;flex-direction:column}.daily strong{font-size:19px}.daily small{font-size:14px;opacity:.8}
.go{background:#1f1f1f;color:#fff;padding:8px 16px;border-radius:999px;font-size:15px}
.section{margin:20px 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid #e5e1d8;background:#fff;color:#2b1f1f}
.chip.on{background:#1f1f1f;color:#fff;border-color:#1f1f1f}
.primary,.secondary{display:block;width:100%;min-height:54px;margin-top:12px;border-radius:16px;border:0;font-size:18px;font-weight:700}
.primary{background:#1f1f1f;color:#fff}.secondary{background:transparent;color:#2b1f1f;box-shadow:inset 0 0 0 1px #e5e1d8}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.stats div{background:#f6f4ef;border-radius:14px;padding:10px 4px;text-align:center;display:flex;flex-direction:column}
.stats b{font-size:22px}.stats span{font-size:12px;color:#6b5d5d}
.note{text-align:center;color:#6b5d5d;font-size:14px;margin:12px 0 0}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.back{min-height:44px;padding:0 12px;border:0;background:transparent;color:#6b5d5d}
.score{margin-inline-start:auto;font-weight:700;font-size:20px}.streak{font-weight:700;color:#c2410c}
.progress{height:8px;border-radius:99px;background:#ece9e1;overflow:hidden}.progress i{display:block;height:100%;background:#2f9e57;border-radius:99px;transition:width .3s}
.meta{display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px;color:#6b5d5d;font-size:14px}
.tag{background:#f1efe9;padding:2px 10px;border-radius:99px}
.timer{display:flex;align-items:center;gap:10px;margin:10px 0 0}.timer .tb{flex:1;height:10px;border-radius:99px;background:#ece9e1;overflow:hidden}.timer .tb i{display:block;height:100%;width:100%;background:#2f9e57;border-radius:99px}.timer .tn{min-width:2.2em;text-align:center;font-weight:800;font-size:20px}.timer.low .tb i{background:#d64545}.timer.low .tn{color:#d64545}
.q{font-size:23px;line-height:1.5;margin:8px 0 16px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:16px;border:1.5px solid #e5e1d8;background:#fff;color:#2b1f1f;text-align:right}
.letter{flex:none;width:32px;height:32px;border-radius:50%;background:#f1efe9;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.ctext{flex:1}.mark{font-weight:800;font-size:20px}
.choice:disabled{cursor:default}
.choice.right{background:#dcf5e4;border-color:#2f9e57;color:#14532d}
.choice.wrong{background:#fde2e2;border-color:#d64545;color:#7f1d1d}
.choice.dim{opacity:.5}
.fb{margin:14px 0 0;font-weight:700;font-size:18px;text-align:center}.fb.right{color:#14532d}.fb.wrong{color:#7f1d1d}
.wheelbtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:14px 16px;border:0;border-radius:18px;background:#e8f0ff;color:#12306b;text-align:right;box-shadow:inset 0 0 0 1.5px #9bb8f5}
.wheelbtn .ico{font-size:30px}.wheelbtn .main{flex:1;display:flex;flex-direction:column}.wheelbtn strong{font-size:19px}.wheelbtn small{font-size:14px;opacity:.8}
.wheelwrap{position:relative;width:min(88vw,350px);aspect-ratio:1;margin:22px auto 10px}
.wring{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#fff 0 5deg,#ffd23f 5deg 15deg);box-shadow:0 8px 0 #0f4fb8,0 14px 22px rgba(20,90,220,.35);border:6px solid #1e6fff}
.wheel{position:absolute;inset:16px;border-radius:50%;border:7px solid #fff;box-shadow:inset 0 0 0 3px #ffa433,0 3px 8px rgba(0,0,0,.12);transition:transform 4.2s cubic-bezier(.15,.75,.12,1);overflow:hidden}
.wlabel{position:absolute;left:50%;top:50%;width:0;height:0}
.wlabel span{position:absolute;left:calc(min(88vw,350px)*0.18);top:0;transform:translateY(-50%);width:calc(min(88vw,350px)*0.28);white-space:nowrap;color:#0b1f3a;font-weight:800;font-size:16px;direction:rtl;text-align:center;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.wpin{position:absolute;top:-14px;left:50%;margin-left:-18px;width:36px;height:36px;background:#ff7a00;border:5px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);z-index:3;box-shadow:0 3px 6px rgba(0,0,0,.25)}
.whub{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;background:#fff;border:6px solid #1e6fff;z-index:2;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.whub i{position:absolute;display:block}
.whub .e{top:20px;width:8px;height:10px;border-radius:50%;background:#0b1f3a}.whub .e1{left:16px}.whub .e2{right:16px}
.whub .m{left:20px;right:20px;top:30px;height:12px;border-bottom:4px solid #0b1f3a;border-radius:0 0 20px 20px}
.whub .c{top:34px;width:9px;height:6px;border-radius:50%;background:#ffb95c}.whub .c1{left:7px}.whub .c2{right:7px}
.wtitle{font-size:30px;text-align:center;margin:6px 0 4px;color:#1e6fff}
.wsub{margin:2px 12px;text-align:center;color:#8a5a7a}
.wspin{background:linear-gradient(#ffa133,#ff7a00)!important;border-radius:999px!important;box-shadow:0 5px 0 #c25a00;color:#fff!important}
.wspin:active{transform:translateY(3px);box-shadow:0 2px 0 #c25a00}
.wpage{background:linear-gradient(#e8f4ff,#fff6dc);margin:-20px -16px;padding:20px 16px 32px;border-radius:0}
.primary:disabled{opacity:.45}
.result{text-align:center;padding-top:12px}.big{font-size:64px;font-weight:800;line-height:1.1;margin:8px 0}.big small{font-size:20px;margin-inline-start:8px;font-weight:500}
.onl{margin:16px 0 4px;padding:12px;border-radius:18px;background:#eaf3ff;box-shadow:inset 0 0 0 1.5px #9bb8f5}
.ostats{text-align:center;font-weight:700;color:#12306b;font-size:15px;margin-bottom:8px}
.orow{display:flex;gap:8px}.orow button{flex:1;min-height:48px;border:0;border-radius:14px;background:#1e6fff;color:#fff;font-weight:700;font-size:16px}
.orow button+button{background:#ff7a00}
.nform{display:flex;gap:8px;margin-top:10px}.nform input{flex:1;min-width:0;min-height:48px;padding:0 12px;border-radius:14px;border:1.5px solid #9bb8f5;font:inherit;background:#fff}
.nform button{min-height:48px;padding:0 18px;border:0;border-radius:14px;background:#27b3a0;color:#fff;font-weight:700}
.lbr{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:6px 0;border-radius:14px;background:#f6f4ef}.lbr.me{background:#fff3c4;box-shadow:inset 0 0 0 1.5px #f0c93a}
.lbr b{min-width:2em;text-align:center}.lbn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbr em{font-style:normal;font-weight:800;color:#1e6fff}
.msgs{height:50vh;overflow-y:auto;padding:8px;border-radius:14px;background:#f6f4ef}
.msg{margin:6px 0;padding:8px 10px;border-radius:12px;background:#fff}.msg.me{background:#e0f0ff}
.mh{display:flex;align-items:center;gap:8px;font-size:13px}.mh small{color:#6b5d5d}.rep{margin-inline-start:auto;border:0;background:transparent;color:#a33;font-size:12px}
.mb{margin-top:2px;word-break:break-word;white-space:pre-wrap}
#app{padding-top:62px!important}
.srow select{font:inherit;max-width:120px}
#snd{position:fixed;top:10px;left:10px;z-index:50;width:44px;height:44px;border-radius:50%;border:0;background:#1e6fff;color:#fff;font-size:20px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
#sndp{position:fixed;top:60px;left:10px;z-index:50;width:230px;padding:12px;border-radius:16px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.3);direction:rtl}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font-size:16px}.srow input[type=range]{flex:1;max-width:120px}.srow input[type=checkbox]{width:22px;height:22px}
.dombtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:14px 16px;border:0;border-radius:18px;background:#fff0e0;color:#7a3b00;text-align:right;box-shadow:inset 0 0 0 1.5px #ffa433}
.dombtn .ico{font-size:30px}.dombtn .main{flex:1;display:flex;flex-direction:column}.dombtn strong{font-size:19px}.dombtn small{font-size:14px;opacity:.8}
.dt{display:inline-flex;flex-direction:column;align-items:center;justify-content:space-between;width:36px;height:70px;padding:3px;margin:3px;background:#fff;border:2px solid #0f1b2d;border-radius:8px;box-shadow:0 2px 0 #0f1b2d;direction:ltr;vertical-align:top}
.dt.h{flex-direction:row;width:70px;height:36px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:26px;height:26px;font-style:normal}
.pg b{width:6px;height:6px;border-radius:50%;background:#1e6fff;margin:auto}
.dl{display:block;width:80%;height:2px;background:#0f1b2d}.dt.h .dl{width:2px;height:80%}
.dchain{max-height:230px;overflow-y:auto;padding:8px;border-radius:14px;background:#e6f4ea;text-align:center;min-height:56px;direction:ltr}
.dhand{display:flex;flex-wrap:wrap;justify-content:center;margin-top:12px}

function doSpin(){
 if(SPINNING||st.spins<=0)return;var T=TOPICS.slice(1),n=T.length,seg=360/n,k=Math.floor(Math.random()*n),jit=(Math.random()-.5)*seg*.6;
