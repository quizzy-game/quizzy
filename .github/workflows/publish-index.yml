name: publish-index
on: workflow_dispatch
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch index.html
        run: |
          python3 - <<'PY'
          import base64, hashlib, sys
          p = 'index.html'
          s = open(p, encoding='utf-8').read()
          pairs = [
              (base64.b64decode('PGRpdiBjbGFzcz0idmVyIj7Ypdi12K/Yp9ixIDM0PC9kaXY+').decode(), base64.b64decode('PGRpdiBjbGFzcz0idmVyIj7Ypdi12K/Yp9ixIDM1PC9kaXY+PGRpdiBjbGFzcz0idmlzIiBpZD0idmlzIj48L2Rpdj4=').decode()),
              (base64.b64decode('PC9ib2R5PjwvaHRtbD4=').decode(), base64.b64decode('').decode()),
          ]
          for a, b in pairs:
              if a not in s:
                  print('MISSING', a[:40]); sys.exit(1)
              s = s.replace(a, b, 1)
          h = hashlib.sha256(s.encode()).hexdigest()
          if h != '0cfd45bcbae2db6f5f38a720108d7dfe922ccda21e6f9e3b05a20eb36a01369c':
              print('SHA MISMATCH', h); sys.exit(1)
          open(p, 'w', encoding='utf-8').write(s)
          print('patched ok', h)
          PY
      - name: commit and push
        run: |
          git config user.name 'quizzy-game'
          git config user.email 'quizzy-game@users.noreply.github.com'
          git add index.html
          git commit -m 'v35: visit counter'
          git push
