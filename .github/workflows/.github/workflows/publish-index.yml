name: publish-index
on: workflow_dispatch
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch index.html
        run: |
          python3 - <<'PY'
          import base64, hashlib, sys
          p = 'index.html'
          s = open(p, encoding='utf-8').read()
          pairs = [
              (base64.b64decode('PGRpdiBjbGFzcz0idmVyIj7Ypdi12K/Yp9ixIDMzPC9kaXY+').decode(), base64.b64decode('PGRpdiBjbGFzcz0idmVyIj7Ypdi12K/Yp9ixIDM0PC9kaXY+').decode()),
              (base64.b64decode('LmxzbiB2aWRlb3t3aWR0aDoxMDAlO2JvcmRlci1yYWRpdXM6MTJweDtiYWNrZ3JvdW5kOiMwMDA7ZGlzcGxheTpibG9ja30=').decode(), base64.b64decode('').decode()),
              (base64.b64decode('dmFyIEw9W1sn2KfZhNit2LHZiNmBINin2YTYpdmG2KzZhNmK2LLZitipIEEgdG8gWiddLFsn2KfZhNij2LHZgtin2YUg2YXZhiDZoSDZhNmAINmi2aAnXSw=').decode(), base64.b64decode('dmFyIEw9W1sn2KfZhNit2LHZiNmBINin2YTYpdmG2KzZhNmK2LLZitipIEEgdG8gWiddLFsn2KfZhNij2LHZgtin2YUg2YXZhiDZoSDZhNmAINmi2aAnLCdGdndyNTk0LXVoZyddLA==').decode()),
              (base64.b64decode('dmFyIGs9aSsxO3JldHVybiAnPGRpdiBjbGFzcz0ibHNuIj48aDM+PHNwYW4gY2xhc3M9Im4iPicrKGs8PTg/J9in2YTYr9ix2LMgJytrOifYqNmI2YbYtScpKyc8L3NwYW4+Jyt4WzBdKyc8L2gzPjx2aWRlbyBjb250cm9scyBwbGF5c2lubGluZSBwcmVsb2FkPSJub25lIiBwb3N0ZXI9InAnK2srJy5qcGc/dj0zMiIgc3JjPSJ2JytrKycubXA0P3Y9MzIiPjwvdmlkZW8+PC9kaXY+Jw==').decode(), base64.b64decode('').decode()),
              (base64.b64decode('fSkuam9pbignJyk7d2luZG93LnNjcm9sbFRvKDAsMCl9fTsKR0FNRVMudW5zaGlmdChnKTs=').decode(), base64.b64decode('').decode()),
          ]
          for a, b in pairs:
              if a not in s:
                  print('MISSING', a[:40]); sys.exit(1)
              s = s.replace(a, b, 1)
          h = hashlib.sha256(s.encode()).hexdigest()
          if h != '6c8fc77ae1b44a58954197434baacf233b05f8c65214270f0b85981938267ee4':
              print('SHA MISMATCH', h); sys.exit(1)
          open(p, 'w', encoding='utf-8').write(s)
          print('patched ok', h)
          PY
      - name: commit and push
        run: |
          git config user.name 'quizzy-game'
          git config user.email 'quizzy-game@users.noreply.github.com'
          git add index.html
          git commit -m 'v34: lesson 2 numbers video (embed)'
          git push
